name: 缺陷报告 / Bug report
description: 报告能够复现的 dsh-archived-chats 缺陷
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。使用问题请前往 Discussions；安全漏洞请使用私密漏洞报告。提交前请删除聊天内容、附件、令牌和本地路径等敏感信息。
  - type: input
    id: plugin-version
    attributes:
      label: 插件版本 / Plugin version
      description: 例如 0.11.0；可在插件市场、npm 或安装信息中查看。
      placeholder: 0.11.0
    validations:
      required: true
  - type: input
    id: harness-version
    attributes:
      label: DeepSeek Harness 版本
      placeholder: 例如 0.1.0-rc.8
    validations:
      required: true
  - type: dropdown
    id: install-source
    attributes:
      label: 安装来源 / Installation source
      options:
        - DeepSeek Harness 插件市场
        - npm 正式包
        - 本地开发目录
        - 其他
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 运行环境 / Environment
      description: 操作系统、浏览器，以及其他有助于复现的信息。
      placeholder: macOS 15, Chrome 140
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 最小复现步骤 / Minimal reproduction
      description: 使用虚构数据，按顺序列出能够稳定触发问题的步骤。
      placeholder: |
        1. 打开……
        2. 点击……
        3. 看到……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为 / Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为 / Actual behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: 已脱敏的日志或截图 / Sanitized logs or screenshots
      description: 不要粘贴真实聊天、附件、令牌、Cookie、私钥或完整用户目录路径。
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: 提交确认 / Submission checks
      options:
        - label: 我已搜索现有 Issue 和 Discussion，没有找到相同问题。
          required: true
        - label: 这不是安全漏洞；安全问题将通过私密漏洞报告提交。
          required: true
        - label: 我没有提交真实聊天内容、附件、凭据或其他个人数据。
          required: true
